services:
  - type: web
    name: casa-governance-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn governance_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
    healthCheckPath: /health
